name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: /cooperative-messenger
      NEXT_PUBLIC_SITE_URL: https://albert-braun.github.io/cooperative-messenger
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove server-only routes
        run: |
          mkdir -p .static-skip
          mv src/app/api .static-skip/api
          mv src/middleware.ts .static-skip/middleware.ts
          ls src/app
      - run: npx next build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
