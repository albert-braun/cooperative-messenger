name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: /cooperative-messenger
      NEXT_PUBLIC_SITE_URL: https://albert-braun.github.io/cooperative-messenger
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove server-only routes
        run: |
          mkdir -p .static-skip
          mv src/app/api .static-skip/api
          mv src/middleware.ts .static-skip/middleware.ts
      - run: npx next build
      - run: touch out/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
